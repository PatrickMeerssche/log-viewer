name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libfontconfig1-dev

      - name: Run cargo check
        run: cargo check --target ${{ matrix.target }}

      - name: Run cargo test
        run: cargo test --target ${{ matrix.target }} --verbose

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Test launcher script (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x log-viewer
          ./log-viewer --help

      - name: Test launcher script (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          log-viewer.bat --help
