name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag Name (e.g., v0.1.0)"
        required: false
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: log-viewer-linux-x86_64.tar.gz
            bin_name: log_visualizer
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: log-viewer-windows-x86_64.zip
            bin_name: log_visualizer.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libfontconfig1-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Linux release
        if: runner.os == 'Linux'
        run: |
          STAGING="log-viewer-linux-x86_64"
          mkdir -p "$STAGING/logs" "$STAGING/csv"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "$STAGING/"
          chmod +x "$STAGING/${{ matrix.bin_name }}"
          cp log-viewer log-viewer.bat log-viewer.ps1 README.md "$STAGING/"
          chmod +x "$STAGING/log-viewer"
          if [ -d "old scripts" ]; then cp -r "old scripts" "$STAGING/"; fi
          touch "$STAGING/logs/.gitkeep" "$STAGING/csv/.gitkeep"
          tar -czvf "${{ matrix.artifact_name }}" "$STAGING"

      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "log-viewer-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "$staging\logs", "$staging\csv"
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.bin_name }}" -Destination "$staging\"
          Copy-Item "log-viewer", "log-viewer.bat", "log-viewer.ps1", "README.md" -Destination "$staging\"
          if (Test-Path "old scripts") { Copy-Item -Recurse "old scripts" -Destination "$staging\" }
          New-Item -ItemType File -Force -Path "$staging\logs\.gitkeep", "$staging\csv\.gitkeep"
          Compress-Archive -Path "$staging" -DestinationPath "${{ matrix.artifact_name }}"

      - name: Upload artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: ${{ matrix.artifact_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
