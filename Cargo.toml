[package]
name = "log_visualizer"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.37.0", default-features = true }
egui = "0.37.0"
egui_plot = "0.38.0"
egui_extras = { version = "0.37.0", features = ["all_loaders"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
chrono = "0.4"
rfd = "0.15"
crossbeam-channel = "0.5"
tiny_http = "0.12"
url = "2.5"
webbrowser = "1.2"
